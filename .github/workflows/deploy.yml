name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system fastapi uvicorn[standard] sqlalchemy pydantic gigachat python-dotenv pytest httpx starlette anyio ruff mypy

      - name: Run linter and tests
        run: |
          pytest
        env:
          GIGACHAT_AUTH_KEY: "dummy-key-for-tests"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract short commit hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: petrakimovdocker
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            petrakimovdocker/scifi_stories:latest
            petrakimovdocker/scifi_stories:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Install Cloud.ru CLI (cloudlogin)
        run: |
          # Установка утилиты cloudlogin для аутентификации в Managed Kubernetes Cloud.ru
          curl -sSL https://gpull.cloud.ru/cloudlogin/install.sh | bash || {
            # Альтернативная установка или скачивание, если скрипт недоступен
            echo "Installing cloudlogin manually..."
            wget https://gpull.cloud.ru/cloudlogin/cloudlogin-linux-amd64 -O /usr/local/bin/cloudlogin
            chmod +x /usr/local/bin/cloudlogin
          }

      - name: Configure Kubernetes Cluster
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Debug Kubeconfig
        run: |
          echo "=== KUBE_CONFIG_CONTENT ==="
          cat ~/.kube/config
          echo "==========================="
          kubectl version

      - name: Generate Secret Manifest from Template
        env:
          GIGACHAT_API_KEY: ${{ secrets.GIGACHAT_API_KEY }}
        run: |
          envsubst < k8s/configmap-secret.yaml.template > k8s/configmap-secret.yaml

      - name: Deploy manifests to Kubernetes
        run: |
          kubectl apply -f k8s