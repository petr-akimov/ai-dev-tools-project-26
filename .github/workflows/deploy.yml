name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system fastapi uvicorn[standard] sqlalchemy pydantic openai python-dotenv pytest httpx starlette anyio ruff mypy

      - name: Run linter and tests
        run: |
          pytest
        env:
          OPENROUTER_API_KEY: "dummy-key-for-tests"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract short commit hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub (to create config.json for Kaniko)
        uses: docker/login-action@v3
        with:
          username: petrakimovdocker
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push with Kaniko
        uses: int128/kaniko-action@v1
        with:
          push: true
          tags: |
            petrakimovdocker/scoreboard:latest
            petrakimovdocker/scoreboard:${{ steps.vars.outputs.sha_short }}
          cache: true

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure Kubernetes Cluster
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy manifests to Kubernetes
        run: |
          kubectl apply -f k8s